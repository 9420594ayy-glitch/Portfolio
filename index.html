<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yingying — Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #eeeeee;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            background: white;
        }

        header h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 500;
        }

        header span {
            font-size: 14px;
        }

        .portfolio {
            width: 90%;
            max-width: 1100px;
            height: 85vh;
            margin: 30px 0;
            background: white;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        footer {
            padding: 20px;
            font-size: 12px;
        }
    </style>
</head>

<body>

<header>
    <h1>YINGYING</h1>
    <span>GRAPHIC DESIGN PORTFOLIO · 2026</span>
</header>

<div class="portfolio">
    <iframe src="Portfolio.pdf"></iframe>
</div>

<footer>
    © 2026 Yingying
</footer>

</body>
</html>
